name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  syntax:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check
  behaviour:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - run: npm test
      - run: npm run test:tcp
  leaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check-leaks.py
